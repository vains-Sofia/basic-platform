server {
    # 启用 IPv6 支持
    listen [::]:8443 ssl; 
	# 同时支持 IPv4
    listen 8443 ssl;  
    #绑定证书的域名
    server_name basic.vains.eu.cc; 
    #请填写证书文件的相对路径或绝对路径
    ssl_certificate /etc/nginx/ssl/vains.eu.cc.pem;
    #请填写私钥文件的相对路径或绝对路径
    ssl_certificate_key /etc/nginx/ssl/vains.eu.cc.key;
	
    ssl_session_timeout 5m;
    #请按照以下协议配置
    ssl_protocols TLSv1.2 TLSv1.3; 
    #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
    ssl_prefer_server_ciphers on;
	
	# ddns自动解析
    location / {
		add_header X-Frame-Options "ALLOW-FROM https://web.vains.eu.cc";
		add_header Content-Security-Policy "frame-ancestors https://web.vains.eu.cc";
		proxy_pass http://127.0.0.1:10000;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
