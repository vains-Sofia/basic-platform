server {
	# 启用 IPv6 支持
    listen [::]:8443 ssl; 
	# 同时支持 IPv4
    listen 8443 ssl;  
    #绑定证书的域名
    server_name web.vains.eu.cc; 
    #请填写证书文件的相对路径或绝对路径
    ssl_certificate /etc/nginx/ssl/vains.eu.cc.pem;
    #请填写私钥文件的相对路径或绝对路径
    ssl_certificate_key /etc/nginx/ssl/vains.eu.cc.key;
	
    ssl_session_timeout 5m;
    #请按照以下协议配置
    ssl_protocols TLSv1.2 TLSv1.3; 
    #请按照以下套件配置，配置加密套件，写法遵循 openssl 标准。
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE; 
    ssl_prefer_server_ciphers on;

	
	# 前端演示页面
    location / {  
       root   html/basic-admin-template;
       index  index.html index.htm;
       try_files $uri $uri/ /index.html;
    }
}
